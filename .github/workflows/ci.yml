name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:schema
      - run: npm run build:runtime
      - run: npm run typecheck -w @agent-studio/bridge
      - run: npm run typecheck -w @agent-studio/studio-api
      - name: Bridge unit tests
        run: npm test -w @agent-studio/bridge
      - name: Build packages
        run: |
          npm run build -w @agent-studio/bridge
          npm run build -w @agent-studio/studio-api
