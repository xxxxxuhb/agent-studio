[package]
name = "bridge-desktop"
version = "0.1.0"
description = "Agent Studio Bridge desktop start/stop tray"
authors = ["agent-studio"]
edition = "2021"

[lib]
name = "bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
