# Agent Studio — local GitLab CE
#
#   docker compose -f deploy/gitlab/docker-compose.yml up -d
#   curl -sS -o /dev/null -w "%{http_code}\n" http://localhost:8929/-/health
#
# First boot is slow. Initial root password:
#   docker exec -it agent-studio-gitlab grep 'Password:' /etc/gitlab/initial_root_password

services:
  gitlab:
    image: gitlab/gitlab-ce:17.11.6-ce.0
    container_name: agent-studio-gitlab
    hostname: localhost
    restart: unless-stopped
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        nginx['listen_port'] = 8929
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
        prometheus_monitoring['enable'] = false
    ports:
      - "8929:8929"
      - "2224:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: "256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8929/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
